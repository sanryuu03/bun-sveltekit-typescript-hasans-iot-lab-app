<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
	<!--
		Hasan's IoT Lab — favicon
		Tile hijau (bg-primary) + chip gelap (primary-foreground), sama dengan logo di header.
	-->
	<defs>
		<linearGradient id="tile" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#a7f000" />
			<stop offset="1" stop-color="#7ccf00" />
		</linearGradient>
	</defs>

	<!-- tile latar -->
	<rect width="32" height="32" rx="8" fill="url(#tile)" />

	<!-- ikon chip (cpu) -->
	<g stroke="#2c4a0e" stroke-width="2" stroke-linecap="round">
		<!-- kaki chip atas & bawah -->
		<line x1="13" y1="7.5" x2="13" y2="10.5" />
		<line x1="19" y1="7.5" x2="19" y2="10.5" />
		<line x1="13" y1="21.5" x2="13" y2="24.5" />
		<line x1="19" y1="21.5" x2="19" y2="24.5" />
		<!-- kaki chip kiri & kanan -->
		<line x1="7.5" y1="13" x2="10.5" y2="13" />
		<line x1="7.5" y1="19" x2="10.5" y2="19" />
		<line x1="21.5" y1="13" x2="24.5" y2="13" />
		<line x1="21.5" y1="19" x2="24.5" y2="19" />
		<!-- badan chip -->
		<rect x="10.5" y="10.5" width="11" height="11" rx="2.5" />
		<!-- core chip -->
		<rect x="14" y="14" width="4" height="4" rx="1" stroke="none" fill="#2c4a0e" />
	</g>
</svg>
